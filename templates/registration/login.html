{% extends "base.html" %}{% block title %}Ingresar{% endblock %}{% block content %}<div class="panel narrow mx-auto"><h1 class="h3 fw-bold mb-4">Ingresar al aula</h1>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<label class="form-label">Correo electrónico</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Contraseña</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-primary w-100">Ingresar</button></form><div class="d-flex justify-content-between mt-3 small"><a href="{% url 'password_reset' %}">Recuperar contraseña</a><a href="{% url 'register' %}">Crear cuenta</a></div></div>{% endblock %}
