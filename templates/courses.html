{% extends "base.html" %}{% block content %}<h1 class="h2 fw-bold mb-4">Cursos publicados</h1><div class="row g-3">{% for c in courses %}<div class="col-md-6 col-xl-4"><div class="feature h-100"><span class="text-primary fw-bold">{{ c.codigo }}</span><h2 class="h5 mt-2">{{ c.titulo }}</h2><p class="small text-secondary">{{ c.programa.nombre|default:"Programa institucional" }} · {{ c.nucleo.nombre }}</p><p>{{ c.descripcion }}</p></div></div>{% empty %}<p class="text-secondary">No hay cursos publicados.</p>{% endfor %}</div>{% endblock %}
